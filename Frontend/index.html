<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Rocket - Full Stack Connection Test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Team Rocket - Full Stack Connection Test</h1>
        
        <div class="section">
            <h2>Test Backend</h2>
            <button id="test-backend-btn">Test Backend</button>
            <pre id="backend-response">Click button to test...</pre>
        </div>

        <div class="section">
            <h2>Demo Login</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" required>
                </div>
                <div class="form-group">
                    <label for="roll-no">Roll No:</label>
                    <input type="text" id="roll-no" required>
                </div>
                <button type="submit">Login</button>
            </form>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
